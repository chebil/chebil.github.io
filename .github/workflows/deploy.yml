name: Build and deploy the site

# One repository, one Pages deployment. Three builds are assembled into a
# single artifact:
#
#   site/            Jekyll  ->  /
#   books/ai/        MyST    ->  /AI-course-book/
#   books/stat/      MyST    ->  /stat/
#   courses/cs2311/  MyST    ->  /DataStructure/
#   courses/cs3401/  MyST    ->  /AlgDesign/
#   courses/cs602/   MyST    ->  /ProbSolvers/
#
# The sub-paths match what the separate repositories published, so no
# existing link changes. tools/build-site.sh runs the same sequence
# locally -- keep the two in step.
#
# There are deliberately no `paths:` filters. A Pages deployment replaces
# the whole site, so a run that skipped the book builds would publish a
# site without the books. Measured on a clean runner the build is ~80s:
# Ruby setup 31s, each book 12s, Jekyll 6s. Not worth splitting.

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ruby 3.1, not later. Jekyll 3.9 pulls Liquid 4.0.3, which calls
      # Object#tainted? -- removed in Ruby 3.2. The build dies there.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          working-directory: site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MyST
        run: npm install -g mystmd

      - name: Install Python helpers
        run: pip install pyyaml

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # The user site serves from the domain root, so baseurl is empty.
      - name: Build the Jekyll site
        working-directory: site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination "${{ github.workspace }}/out" --baseurl ""

      - name: Build the AI book
        working-directory: books/ai
        env:
          BASE_URL: /AI-course-book
        run: myst build --html

      - name: Build the statistics book
        working-directory: books/stat
        env:
          BASE_URL: /stat
        run: myst build --html

      # Jupyter Book published /stat/part1/ch01_datasets.html; MyST
      # publishes /stat/part1/ch01-datasets/. Keeps the old links alive.
      - name: Add redirects for the old statistics book URLs
        working-directory: books/stat
        run: python scripts/make_redirects.py

      - name: Build the courses
        run: |
          ( cd courses/cs2311 && BASE_URL=/DataStructure myst build --html )
          ( cd courses/cs3401 && BASE_URL=/AlgDesign     myst build --html )
          ( cd courses/cs602  && BASE_URL=/ProbSolvers   myst build --html )

      # MyST lowercases every path segment, so /DataStructure/Labs/Lab1
      # would become /DataStructure/labs/lab1/ and 404 on a case-sensitive
      # host. Only the seven lab pages need this; Pages resolves the rest.
      - name: Add redirects for the old course URLs
        run: python tools/make_course_redirects.py

      - name: Assemble the books and courses under the site
        run: |
          mkdir -p out/AI-course-book out/stat \
                   out/DataStructure out/AlgDesign out/ProbSolvers
          cp -r books/ai/_build/html/. out/AI-course-book/
          cp -r books/stat/_build/html/. out/stat/
          # Copied over the Jekyll output, not instead of it: the two
          # reveal.js decks still come from Jekyll inside these paths.
          cp -r courses/cs2311/_build/html/. out/DataStructure/
          cp -r courses/cs3401/_build/html/. out/AlgDesign/
          cp -r courses/cs602/_build/html/. out/ProbSolvers/

      - name: Check the assembled tree
        run: |
          set -e
          for p in \
            out/index.html \
            out/feed.xml \
            out/DataStructure/index.html \
            out/DataStructure/chap1/index.html \
            out/DataStructure/Labs/Lab1.html \
            out/DataStructure/labs/lab1/index.html \
            out/AlgDesign/chap7/index.html \
            out/ProbSolvers/chap1/index.html \
            out/ProbSolvers/slideschap2.html \
            out/AI-course-book/index.html \
            out/AI-course-book/ch13-integration/index.html \
            out/stat/index.html \
            out/stat/part1/ch01-datasets/index.html \
            out/stat/part1/ch01_datasets.html
          do
            [ -f "$p" ] || { echo "::error::missing $p"; exit 1; }
          done
          echo "assembled $(find out -type f | wc -l) files"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    # Publish only from the default branch, and never from a pull request.
    # A workflow_dispatch run on a feature branch builds and uploads the
    # artifact for inspection without touching the live site.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
