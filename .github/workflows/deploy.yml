name: Deploy MyST site to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  # Served from https://chebil.github.io/stat/ -- resolves to "/stat".
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MyST
        run: npm install -g mystmd

      - name: Build the book
        run: myst build --html

      # Jupyter Book published /part1/ch01_datasets.html; MyST publishes
      # /part1/ch01-datasets/. These stubs keep the old links resolving.
      - name: Add redirects for the old Jupyter Book URLs
        run: |
          pip install pyyaml
          python scripts/make_redirects.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'

  deploy:
    needs: build
    # Never publish from a pull request -- PRs build to validate, nothing more.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
